name: LocateAI
description: >-
  LocateAI (Locate) is an AI-integrated commercial real estate brokerage focused on retail site
  selection for multi-unit and franchise brands. Its platform pairs proprietary AI models with
  full-service advisory to help brands choose markets, source and score sites, forecast Year-1
  revenue and cannibalization risk, right-size franchise territories, and negotiate leases — from
  the first market through the signed lease. The models analyze 200M+ mobile devices and 1,100+
  variables for device-level trade-area, fair-share, and time-weighted revenue analysis. Locate is
  delivered as a managed service; it does not currently publish a public developer API, SDK, or
  documentation surface. Added to the API Evangelist network as a Techstars portfolio company.
